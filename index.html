<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECIAL THANKS | EGGING CHARITY 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 基礎設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            line-height: 1.8;
            padding: 80px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        /* メインタイトルエリア */
        header {
            margin-bottom: 80px;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 56px;
            line-height: 1.0;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #fff;
        }

        .sub-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5em;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* セクションタイトル */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 60px;
            margin-bottom: 30px;
        }

        .section-header::before,
        .section-header::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #222;
        }

        .section-header span {
            padding: 0 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: #888;
            text-transform: uppercase;
        }

        /* 名前リストのレイアウト */
        .name-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px 30px;
        }

        /* テスター枠（3,000円）：大きく強調 */
        .tester-name {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
        }

        /* サポーター枠（1,000円）：標準 */
        .supporter-name {
            font-size: 16px;
            color: #aaa;
            font-weight: 400;
        }

        /* フッター */
        footer {
            margin-top: 120px;
            padding-top: 40px;
            border-top: 1px solid #111;
        }

        .footer-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #444;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* スマホ対応 */
        @media (max-width: 600px) {
            .main-title {
                font-size: 38px;
            }
            .sub-title {
                font-size: 14px;
                letter-spacing: 0.3em;
            }
            .tester-name {
                font-size: 20px;
            }
            .supporter-name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="main-title">EGGING CHARITY</h1>
        <p class="sub-title">2026 EDITION</p>
    </header>

    <div class="section-header">
        <span>Official Testers</span>
    </div>
    <div class="name-list">
        <div class="tester-name">笠松 仁</div>
        <div class="tester-name">岡 隆之</div>
        <div class="tester-name">片山 愛海</div>
        <div class="tester-name">++++++++</div>
        <div class="tester-name">++++++++</div>
        </div>

    <div class="section-header">
        <span>Project Supporters</span>
    </div>
    <div class="name-list">
        <div class="supporter-name">栂野 晶洋</div>
        <div class="supporter-name">SUPPORTER NAME 02</div>
        <div class="supporter-name">SUPPORTER NAME 03</div>
        <div class="supporter-name">SUPPORTER NAME 04</div>
        <div class="supporter-name">SUPPORTER NAME 05</div>
        </div>

    <footer>
        <p class="footer-text">
            ARTWORK BY HIROTTON / PROJECT BY RITSURI-TOGANO<br>
            © 2026 EGGING CULTURE REVIVAL PROJECT
        </p>
    </footer>
</div>

</body>
</html>
