<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECIAL THANKS | EGGING SUPPORT PROJECT</title>
    <style>
        /* 全体のスタイル設定 */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            line-height: 1.6;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }

        /* ページ全体のコンテナ */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* メインタイトル */
        h1 {
            font-size: 28px;
            letter-spacing: 0.3em;
            margin-bottom: 60px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* 各セクションのタイトル（TESTERS / SUPPORTERS） */
        .section-title {
            font-size: 14px;
            letter-spacing: 0.4em;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 30px;
            margin-top: 60px;
            text-transform: uppercase;
        }

        /* 名前を表示するエリア */
        .name-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 20px; /* 上下左右の間隔 */
        }

        /* テスター名のスタイル（3,000円枠：少し大きめ・強調） */
        .tester-name {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.05em;
        }

        /* サポーター名のスタイル（1,000円枠：標準サイズ） */
        .supporter-name {
            font-size: 16px;
            color: #bbb;
        }

        /* 区切り文字（任意で名前の間に「 / 」を入れる場合） */
        .separator {
            color: #444;
            margin: 0 5px;
        }

        /* フッター */
        .footer {
            margin-top: 120px;
            font-size: 12px;
            color: #555;
            letter-spacing: 0.1em;
        }

        /* スマホ向けの微調整 */
        @media (max-width: 600px) {
            h1 { font-size: 22px; }
            .tester-name { font-size: 18px; }
            .supporter-name { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Special Thanks</h1>

    <div class="section-title">Testers</div>
    <div class="name-grid">
        <div class="tester-name"笠松 仁</div>
        <div class="tester-name">岡 隆之</div>
        <div class="tester-name">大村 将良</div>
        <div class="tester-name">谷口 大輔</div>
        <div class="tester-name">片山 愛海</div>
        </div>

    <div class="section-title">Supporters</div>
    <div class="name-grid">
        <div class="supporter-name">SUPPORTER NAME 01</div>
        <div class="supporter-name">SUPPORTER NAME 02</div>
        <div class="supporter-name">SUPPORTER NAME 03</div>
        <div class="supporter-name">SUPPORTER NAME 04</div>
        <div class="supporter-name">SUPPORTER NAME 05</div>
        <div class="supporter-name">SUPPORTER NAME 06</div>
        <div class="supporter-name">SUPPORTER NAME 07</div>
        <div class="supporter-name">SUPPORTER NAME 08</div>
        </div>

    <div class="footer">
        EGGING CULTURE REVIVAL PROJECT<br>
        DESIGNED BY HIROTTON<br>
        POWERED BY RE:TREE
    </div>
</div>

</body>
</html>
